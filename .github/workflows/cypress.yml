name: Testes Cypress

on:
  push:
    branches: [atividade14-dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Executar testes Cypress
        id: testes
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p evidencias
          npx cypress run 2>&1 | tee evidencias/execucao.log
      - name: Salvar evidencias no repositorio
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f evidencias
          git commit -m "evidencias: resultado da execucao" || echo "nada a commitar"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias
          path: evidencias
      - name: Falhar se houve testes reprovados
        if: steps.testes.outcome == 'failure'
        run: exit 1
