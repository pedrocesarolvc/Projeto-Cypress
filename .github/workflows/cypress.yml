name: Testes Cypress

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6

      - name: Salvar screenshots (evidências)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Salvar vídeos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-videos
          path: cypress/videos
          if-no-files-found: ignore
