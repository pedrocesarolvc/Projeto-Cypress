name: Recon
on:
  push:
    branches: [atividade14-dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar HTML das paginas
        run: bash recon2.sh
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add recon2
          git commit -m "recon: html das paginas" || echo "nada a commitar"
          git push
